
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAXX BANNA 11</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:white;font-family:Arial,sans-serif}
header{padding:22px;background:#192338;text-align:center}
h1{margin:0;color:#71b7ff}
main{max-width:650px;margin:25px auto;padding:16px}
.card{background:#202c42;padding:22px;border-radius:18px;margin-bottom:18px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#3488ed;color:white;font-size:16px;margin-top:10px;cursor:pointer}
button:disabled{opacity:.5}
.folder{background:#293750;text-align:left}
input{width:100%;padding:13px;border-radius:9px;border:0;margin-top:12px}
#dashboard{display:none}
#message{color:#b7c5d9;overflow-wrap:anywhere}
.file{background:#293750;padding:12px;border-radius:10px;margin-top:10px}
.file button{width:48%;display:inline-block;font-size:13px}
.danger{background:#c43d4b}
small{color:#b7c5d9}
</style>
</head>

<body>
<header>
<h1>DAXX BANNA 11</h1>
<p>My Personal Cloud Storage</p>
</header>

<main>

<section class="card" id="login">
<h2>Welcome</h2>
<p>Sign in to use your personal cloud storage.</p>
<button id="googleButton" onclick="signInWithGoogle()">
Continue with Google
</button>
<p id="message"></p>
</section>

<section id="dashboard">

<div class="card">
<h2>My Storage</h2>
<p id="userEmail"></p>
<p>Your personal cloud space</p>
</div>

<div class="card">
<h2>My Folders</h2>
<button class="folder" onclick="openFolder('Photos')">📷 Photos</button>
<button class="folder" onclick="openFolder('Videos')">🎬 Videos</button>
<button class="folder" onclick="openFolder('Music')">🎵 Music</button>
<button class="folder" onclick="openFolder('Documents')">📁 Documents</button>
</div>

<div class="card">
<h2 id="folderName">Photos</h2>

<input type="file" id="fileInput" multiple>

<button id="uploadButton" onclick="uploadFiles()">
Upload to Cloud
</button>

<p id="storageMessage"></p>
</div>

<div class="card">
<h2>My Cloud Files</h2>
<button onclick="loadFiles()">Refresh Files</button>
<div id="fileList">Select a folder to see files.</div>
</div>

<div class="card">
<button onclick="logout()" class="danger">Logout</button>
</div>

</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://dsxmzcicvjtzlrvjbnpr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rG7RBl5EY45PrNRUCGp1TQ_yTRIbSJH";

const BUCKET_NAME = "Daxu files";

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser = null;
let currentFolder = "Photos";

function showMessage(text) {
document.getElementById("storageMessage").textContent = text;
}

function openFolder(name) {
currentFolder = name;
document.getElementById("folderName").textContent = name;
document.getElementById("fileInput").value = "";
loadFiles();
}

function showDashboard(user) {
currentUser = user;

document.getElementById("login").style.display = "none";
document.getElementById("dashboard").style.display = "block";
document.getElementById("userEmail").textContent =
user.email || "Logged in";

loadFiles();
}

function showLogin() {
currentUser = null;
document.getElementById("login").style.display = "block";
document.getElementById("dashboard").style.display = "none";
}

async function signInWithGoogle() {
const button = document.getElementById("googleButton");
const message = document.getElementById("message");

button.disabled = true;
message.textContent = "Connecting to Google...";

const { error } = await supabaseClient.auth.signInWithOAuth({
provider: "google",
options: {
redirectTo: "https://rajputdalpatsinh1.github.io/DAXX-BANNA-11/"
}
});

if (error) {
message.textContent = error.message;
button.disabled = false;
}
}

async function checkLogin() {
const { data, error } =
await supabaseClient.auth.getSession();

if (error) {
document.getElementById("message").textContent = error.message;
return;
}

if (data.session) {
showDashboard(data.session.user);
} else {
showLogin();
}
}

supabaseClient.auth.onAuthStateChange((event, session) => {
if (session) {
currentUser = session.user;
document.getElementById("login").style.display = "none";
document.getElementById("dashboard").style.display = "block";
document.getElementById("userEmail").textContent =
session.user.email || "Logged in";
setTimeout(loadFiles, 0);
} else if (event === "SIGNED_OUT") {
showLogin();
}
});

async function uploadFiles() {
if (!currentUser) {
showMessage("Please login first.");
return;
}

const input = document.getElementById("fileInput");
const files = input.files;

if (!files.length) {
showMessage("Pehle files select karo.");
return;
}

const button = document.getElementById("uploadButton");
button.disabled = true;

for (const file of files) {
const safeName = file.name.replace(/[\/\\]/g, "_");
const filePath =
currentUser.id + "/" + currentFolder + "/" + safeName;

showMessage("Uploading: " + file.name);

const { error } = await supabaseClient.storage
.from(BUCKET_NAME)
.upload(filePath, file);

if (error) {
showMessage("Upload error: " + error.message);
button.disabled = false;
return;
}
}

input.value = "";
button.disabled = false;
showMessage("All files uploaded successfully! ❤️");
loadFiles();
}

async function loadFiles() {
if (!currentUser) return;

const folderPath = currentUser.id + "/" + currentFolder;

const list = document.getElementById("fileList");
list.textContent = "Loading files...";

const { data, error } = await supabaseClient.storage
.from(BUCKET_NAME)
.list(folderPath, {
limit: 100,
sortBy: { column: "name", order: "asc" }
});

if (error) {
list.textContent = "Error: " + error.message;
return;
}

list.replaceChildren();

const files = (data || []).filter(item => item.id);

if (!files.length) {
list.textContent = "No files in this folder yet.";
return;
}

files.forEach(file => {
const path = folderPath + "/" + file.name;

const box = document.createElement("div");
box.className = "file";

const name = document.createElement("p");
name.textContent = "📄 " + file.name;

const downloadButton = document.createElement("button");
downloadButton.textContent = "Download";
downloadButton.onclick = () => downloadFile(path, file.name);

const deleteButton = document.createElement("button");
deleteButton.textContent = "Delete";
deleteButton.className = "danger";
deleteButton.onclick = () => deleteFile(path);

box.append(name, downloadButton, deleteButton);
list.appendChild(box);
});
}

async function downloadFile(path, name) {
showMessage("Downloading...");

const { data, error } = await supabaseClient.storage
.from(BUCKET_NAME)
.download(path);

if (error) {
showMessage("Download error: " + error.message);
return;
}

const url = URL.createObjectURL(data);
const link = document.createElement("a");
link.href = url;
link.download = name;
link.click();

setTimeout(() => URL.revokeObjectURL(url), 1000);
showMessage("Download started.");
}

async function deleteFile(path) {
if (!confirm("Kya tum ye file delete karna chahte ho?")) {
return;
}

const { error } = await supabaseClient.storage
.from(BUCKET_NAME)
.remove([path]);

if (error) {
showMessage("Delete error: " + error.message);
return;
}

showMessage("File deleted successfully.");
loadFiles();
}

async function logout() {
const { error } = await supabaseClient.auth.signOut();

if (error) {
alert(error.message);
}
}

checkLogin();
</script>

</body>
</html>
